version: '3'
services:
  nginx:
    image: 'nginx:latest'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/ssl
    ports:
      - 443:443
    depends_on:
      - client
    logging:
      driver: none
  server:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - '3000:3000'
      - '9229:9229'
    volumes:
      - .:/usr/src/app:cached
      - ec-server-node_modules:/usr/src/app/node_modules:Z
    depends_on:
      - redis
  client:
    build: ./client
    ports:
      - '3001:3001'
    stdin_open: true
    tty: true
    volumes:
      - ./client:/usr/src/app:cached
      - ec-client-node_modules:/usr/src/app/node_modules:Z
    depends_on:
      - server
  redis:
    image: 'redis:alpine'

volumes:
  ec-client-node_modules:
  ec-server-node_modules:
